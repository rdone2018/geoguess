<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeoGuess</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: sans-serif; background: #1a1a2e; color: #fff; height: 100vh; display: flex; flex-direction: column; }
    header { padding: 12px 20px; background: #16213e; display: flex; align-items: center; justify-content: space-between; }
    header h1 { font-size: 1.3rem; }
    .screen { flex: 1; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 16px; }
    .screen.hidden { display: none; }
    .card { background: #16213e; padding: 32px; border-radius: 8px; width: 360px; }
    .card h2 { margin-bottom: 16px; font-size: 1.2rem; }
    .card input { width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid #0f3460; border-radius: 4px; background: #1a1a2e; color: #fff; font-size: 0.95rem; }
    .card button { width: 100%; padding: 10px; background: #0f3460; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 0.95rem; }
    .card button:hover { background: #1a5085; }
    .card .error { color: #ff5252; font-size: 0.85rem; margin-top: 8px; }
    .card .info { color: #4fc3f7; font-size: 0.9rem; margin-top: 12px; text-align: center; }
    .card .code { font-size: 2rem; letter-spacing: 4px; color: #69f0ae; text-align: center; margin: 12px 0; font-family: monospace; }
    .lobby-list { list-style: none; margin: 12px 0; }
    .lobby-list li { padding: 6px 0; border-bottom: 1px solid #0f3460; }
    #game-screen { flex: 1; display: flex; flex-direction: column; }
    #game-screen.hidden { display: none; }
    #main { flex: 1; display: flex; }
    #sv-container { width: 50%; height: 100%; position: relative; }
    #osm-container { width: 50%; height: 100%; }
    #coords { padding: 8px 20px; background: #16213e; font-size: 0.85rem; color: #aaa; display: flex; justify-content: space-between; }
    #distance { color: #4fc3f7; font-weight: bold; }
    .role-btns { display: flex; gap: 12px; }
    .role-btns button { flex: 1; padding: 14px; font-size: 1rem; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>GeoGuess</h1>
      <div id="db-status" style="font-size:0.75rem;margin-top:2px;">Checking DB...</div>
    </div>
  </header>

  <div id="login-screen" class="screen">
    <div class="card">
      <h2>Join GeoGuess</h2>
      <div id="player-form" style="margin-top:16px;">
        <input id="session-code" placeholder="Session code">
        <input id="player-name" placeholder="Your name">
        <button onclick="joinSession()">Join Session</button>
        <div class="error" id="player-error"></div>
      </div>
      <div style="margin-top:12px;text-align:center;">
        <a href="#" onclick="toggleAdminForm();return false;" style="color:#666;font-size:0.8rem;">Admin: Create Session</a>
      </div>
      <div id="admin-form" style="display:none; margin-top:16px;">
        <input id="admin-name" placeholder="Your name">
        <button onclick="createSession()">Create Game Session</button>
        <div class="error" id="admin-error"></div>
      </div>
    </div>
  </div>

  <div id="lobby-screen" class="screen hidden">
    <div class="card">
      <h2 id="lobby-title">Lobby</h2>
      <div class="code" id="lobby-code"></div>
      <p style="color:#aaa;font-size:0.85rem;text-align:center;">Share this code with players</p>
      <ul class="lobby-list" id="lobby-players"></ul>
      <div id="settings" style="display:none; margin:12px 0;">
        <div style="display:flex;gap:12px;justify-content:center;">
          <label style="color:#aaa;font-size:0.85rem;">Rounds: <input id="input-rounds" type="number" value="5" min="1" max="10" style="width:50px;padding:4px;background:#1a1a2e;color:#fff;border:1px solid #333;border-radius:4px;"></label>
          <label style="color:#aaa;font-size:0.85rem;">Timer (s): <input id="input-timer" type="number" value="60" min="10" max="120" style="width:55px;padding:4px;background:#1a1a2e;color:#fff;border:1px solid #333;border-radius:4px;"></label>
        </div>
      </div>
      <button id="start-btn" onclick="startGame()" style="display:none;">Start Game</button>
      <div class="info" id="lobby-info">Waiting for players...</div>
    </div>
  </div>

  <div id="game-screen" class="hidden">
    <div id="countdown-bar" style="padding:8px 20px;background:#0f3460;text-align:center;font-size:1.5rem;font-weight:bold;color:#ffab40;">
      <span id="round-info">Round 1/5</span> &nbsp;|&nbsp; <span id="timer-display">1:00</span>
    </div>
    <div id="main">
      <div id="sv-container"></div>
      <div id="osm-container"></div>
    </div>
    <div id="coords">
      <span id="distance"></span>
    </div>
    <div id="score-overlay" class="hidden" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);align-items:center;justify-content:center;z-index:9999;display:none;">
      <div style="background:#16213e;padding:30px 40px;border-radius:12px;min-width:320px;">
        <h2 style="color:#fff;margin-bottom:16px;">Scores</h2>
        <table id="score-table" style="width:100%;border-collapse:collapse;color:#fff;">
          <thead><tr style="color:#ffab40;"><th style="padding:6px;text-align:left;">#</th><th style="padding:6px;text-align:left;">Player</th><th style="padding:6px;text-align:right;">Points</th></tr></thead>
          <tbody></tbody>
        </table>
        <p id="score-next-round" style="color:#aaa;margin-top:16px;font-size:0.85rem;"></p>
      </div>
    </div>
  </div>

  <script>
    let myName = '';
    let sessionCode = '';
    let isAdmin = false;

    fetch('/api/db-status').then(r => r.json()).then(data => {
      const el = document.getElementById('db-status');
      if (data.connected) {
        el.textContent = 'DB: Connected';
        el.style.color = '#69f0ae';
      } else {
        el.textContent = 'DB: Error - ' + data.error;
        el.style.color = '#ff5252';
      }
    }).catch(() => {
      const el = document.getElementById('db-status');
      el.textContent = 'DB: Unreachable';
      el.style.color = '#ff5252';
    });
    let sv, map, currentPos = null, svMarker = null, clickMarker = null, polyline = null, distanceLabel = null;
    let pollInterval = null;

    function toggleAdminForm() {
      const adminForm = document.getElementById('admin-form');
      const playerForm = document.getElementById('player-form');
      if (adminForm.style.display === 'none') {
        adminForm.style.display = 'block';
        playerForm.style.display = 'none';
      } else {
        adminForm.style.display = 'none';
        playerForm.style.display = 'block';
      }
    }

    async function createSession() {
      const username = document.getElementById('admin-name').value.trim();
      if (!username) return;
      myName = username;
      isAdmin = true;
      try {
        await fetch('/api/admin/create', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({username}) });
        const res = await fetch('/api/admin/session', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({username}) });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        sessionCode = data.code;
        enterLobby();
      } catch (e) {
        document.getElementById('admin-error').textContent = e.message;
      }
    }

    async function joinSession() {
      const code = document.getElementById('session-code').value.trim().toUpperCase();
      const username = document.getElementById('player-name').value.trim();
      if (!code || !username) return;
      myName = username;
      isAdmin = false;
      try {
        const res = await fetch('/api/join', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({code, username}) });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        sessionCode = code;
        enterLobby();
      } catch (e) {
        document.getElementById('player-error').textContent = e.message;
      }
    }

    function enterLobby() {
      document.getElementById('login-screen').classList.add('hidden');
      document.getElementById('lobby-screen').classList.remove('hidden');
      document.getElementById('lobby-code').textContent = sessionCode;
      if (isAdmin) {
        document.getElementById('lobby-title').textContent = 'Your Game Lobby';
        document.getElementById('start-btn').style.display = 'block';
        document.getElementById('settings').style.display = 'block';
        document.getElementById('lobby-info').textContent = 'Waiting for players to join...';
      } else {
        document.getElementById('lobby-title').textContent = 'Waiting Room';
        document.getElementById('lobby-info').textContent = 'Waiting for admin to start the game...';
      }
      pollLobby();
    }

    async function pollLobby() {
      if (pollInterval) clearInterval(pollInterval);
      pollInterval = setInterval(async () => {
        try {
          const res = await fetch(`/api/session/${sessionCode}`);
          const data = await res.json();
          const list = document.getElementById('lobby-players');
          list.innerHTML = data.players.map(p => `<li>${p === myName ? p + ' (you)' : p}</li>`).join('');
          if (data.status === 'active' && data.location) {
            clearInterval(pollInterval);
            startGameView(data.location, data.rounds, data.timer, data.current_round);
          }
        } catch (e) {}
      }, 2000);
    }

    async function startGame() {
      try {
        const rounds = parseInt(document.getElementById('input-rounds').value) || 5;
        const timer = parseInt(document.getElementById('input-timer').value) || 60;
        const res = await fetch(`/api/session/${sessionCode}/start`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({username: myName, rounds, timer}) });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        startGameView({ lat: data.lat, lng: data.lng }, data.rounds, data.timer, data.round);
      } catch (e) {
        document.getElementById('lobby-info').textContent = e.message;
      }
    }

    let countdownInterval = null;
    let totalRounds = 5;
    let currentRound = 1;
    let remainingTime = 0;
    let guessSubmitted = false;
    let roundEnded = false;
    let clickTimer = null;

    function endRound() {
      if (roundEnded) return;
      roundEnded = true;
      if (countdownInterval) clearInterval(countdownInterval);
      if (clickTimer) clearTimeout(clickTimer);
      nextRound();
    }

    function startCountdown(timerSecs) {
      if (countdownInterval) clearInterval(countdownInterval);
      remainingTime = timerSecs;
      guessSubmitted = false;
      roundEnded = false;
      const timerEl = document.getElementById('timer-display');
      const bar = document.getElementById('countdown-bar');
      function update() {
        const m = Math.floor(remainingTime / 60);
        const s = remainingTime % 60;
        timerEl.textContent = m + ':' + String(s).padStart(2, '0');
        bar.style.color = remainingTime <= 10 ? '#ff5252' : '#ffab40';
        if (remainingTime <= 0) {
          endRound();
          return;
        }
        remainingTime--;
      }
      update();
      countdownInterval = setInterval(update, 1000);
    }

    function onGuessClick() {
      if (guessSubmitted || roundEnded) return;
      guessSubmitted = true;
      clickTimer = setTimeout(endRound, 5000);
    }

    function updateRoundInfo() {
      document.getElementById('round-info').textContent = `Round ${currentRound}/${totalRounds}`;
    }

    async function nextRound() {
      try {
        const res = await fetch(`/api/session/${sessionCode}/next-round`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: '{}' });
        const data = await res.json();
        if (data.done) {
          await showFinalScores();
          return;
        }
        await showScores();
        document.getElementById('score-overlay').classList.add('hidden');
        document.getElementById('score-overlay').style.display = 'none';
        currentRound = data.round;
        updateRoundInfo();
        currentPos = { lat: data.lat, lng: data.lng };
        if (sv) sv.setPosition({ lat: data.lat, lng: data.lng });
        if (map) map.setView([20, 0], 2);
        clearMarkers();
        if (svMarker) { map.removeLayer(svMarker); svMarker = null; }
        if (clickMarker) { map.removeLayer(clickMarker); clickMarker = null; }
        if (polyline) { map.removeLayer(polyline); polyline = null; }
        if (distanceLabel) { map.removeLayer(distanceLabel); distanceLabel = null; }
        document.getElementById('distance').textContent = '';
        startCountdown(data.timer);
      } catch (e) {
        document.getElementById('timer-display').textContent = 'Error';
      }
    }

    async function showFinalScores() {
      const res = await fetch(`/api/session/${sessionCode}/scores`);
      const data = await res.json();
      const tbody = document.querySelector('#score-table tbody');
      tbody.innerHTML = data.scores.map((s, i) => {
        const highlight = i < 3 ? 'background:rgba(255,171,64,0.2);font-weight:bold;' : '';
        const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : '';
        return `<tr style="${highlight}"><td style="padding:4px;">${medal || i + 1}</td><td style="padding:4px;">${s.username}</td><td style="padding:4px;text-align:right;">${s.total}</td></tr>`;
      }).join('');
      document.getElementById('score-next-round').textContent = 'Game Over!';
      document.getElementById('round-info').textContent = 'Final Results';
      const overlay = document.getElementById('score-overlay');
      overlay.classList.remove('hidden');
      overlay.style.display = 'flex';
    }

    async function showScores() {
      const res = await fetch(`/api/session/${sessionCode}/scores`);
      const data = await res.json();
      const tbody = document.querySelector('#score-table tbody');
      tbody.innerHTML = data.scores.map((s, i) =>
        `<tr><td style="padding:4px;">${i + 1}</td><td style="padding:4px;">${s.username}</td><td style="padding:4px;text-align:right;">${s.total}</td></tr>`
      ).join('');
      document.getElementById('score-next-round').textContent = 'Next round in 5s...';
      const overlay = document.getElementById('score-overlay');
      overlay.classList.remove('hidden');
      overlay.style.display = 'flex';
      await new Promise(r => setTimeout(r, 5000));
    }

    function startGameView(loc, rounds, timer, round) {
      document.getElementById('lobby-screen').classList.add('hidden');
      document.getElementById('game-screen').classList.remove('hidden');
      totalRounds = rounds || 5;
      currentRound = round || 1;
      updateRoundInfo();
      currentPos = { lat: loc.lat, lng: loc.lng };
      initMaps(loc);
      startCountdown(timer || 60);
    }

    function initMaps(loc) {
      map = L.map('osm-container').setView([20, 0], 2);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);

      map.on('click', function(e) {
        clearMarkers();
        if (svMarker) { map.removeLayer(svMarker); svMarker = null; }
        const clicked = { lat: e.latlng.lat, lng: e.latlng.lng };
        clickMarker = L.marker(e.latlng, { title: 'Your guess' }).addTo(map);
        if (currentPos) {
          svMarker = L.marker([currentPos.lat, currentPos.lng], { title: 'Street View' }).addTo(map);
          svMarker.bindTooltip('Street View', { permanent: true, direction: 'top', offset: [0, -10] });
          const d = haversine(currentPos.lat, currentPos.lng, clicked.lat, clicked.lng);
          document.getElementById('distance').textContent = `Distance: ${formatDistance(d)}`;
          polyline = L.polyline([[currentPos.lat, currentPos.lng], [clicked.lat, clicked.lng]], { color: '#ff5252', weight: 3, dashArray: '8 8' }).addTo(map);
          distanceLabel = L.marker(e.latlng, {
            icon: L.divIcon({
              className: '',
              html: `<div style="background:#1a1a2e;color:#4fc3f7;padding:4px 8px;border-radius:4px;font-size:12px;white-space:nowrap;border:1px solid #4fc3f7;">${formatDistance(d)}</div>`,
              iconSize: [0, 0]
            })
          }).addTo(map);
        }
        if (!guessSubmitted && myName) {
          onGuessClick();
          fetch(`/api/session/${sessionCode}/guess`, {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ username: myName, lat: clicked.lat, lng: clicked.lng, remaining_time: remainingTime })
          }).then(r => r.json()).then(data => {
            if (data.points !== undefined) {
              document.getElementById('distance').textContent += ` | Points: ${data.points}`;
            }
          }).catch(() => {});
        }
      });

      fetch('/api/config')
        .then(r => r.json())
        .then(({ apiKey }) => {
          const s = document.createElement('script');
          s.src = 'https://maps.googleapis.com/maps/api/js?key=' + apiKey + '&v=weekly';
          s.onload = () => {
            sv = new google.maps.StreetViewPanorama(document.getElementById('sv-container'), {
              position: { lat: loc.lat, lng: loc.lng },
              pov: { heading: 0, pitch: 0 },
              zoom: 1,
              addressControl: false,
              zoomControl: false,
              fullscreenControl: false,
              streetSideControls: false,
              showRoadLabels: false,
              showBuildingLabels: false,
              enableCloseButton: false
            });
          };
          document.head.appendChild(s);
        });
    }

    function clearMarkers() {
      if (clickMarker) map.removeLayer(clickMarker);
      if (polyline) map.removeLayer(polyline);
      if (distanceLabel) map.removeLayer(distanceLabel);
      clickMarker = null; polyline = null; distanceLabel = null;
    }

    function haversine(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function formatDistance(km) {
      if (km < 1) return Math.round(km * 1000) + ' m';
      if (km < 100) return km.toFixed(1) + ' km';
      return Math.round(km) + ' km';
    }
  </script>
</body>
</html>
