<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeoGuess</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>
  <style>
    :root{
      --ink:#172f4d;
      --muted:#647891;
      --line:#d8e4f0;
      --paper:#fff;
      --canvas:#f2f7fc;
      --green:#173e68;
      --green-soft:#e2effa;
      --lime:#c7e5fb;
      --coral:#548fc4;
      --coral-soft:#e7f2fb;
      --shadow:0 18px 50px #18395712;
      font-family:'Open Sans',Arial,sans-serif;
      color:var(--ink);
      background:var(--canvas);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-width:320px;font-size:14px;line-height:1.5}
    button,input,select{font:inherit}
    button{cursor:pointer}
    button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #6da6d5;outline-offset:2px}
    a{color:inherit}
    
    .app-shell{min-height:100vh;display:grid;grid-template-columns:236px minmax(0,1fr)}
    .sidebar{padding:27px 18px 20px 24px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:34px;background:#f8f8f3}
    .brand{display:flex;gap:11px;align-items:center;padding:0 8px}
    .brand-mark{width:38px;height:38px;border-radius:13px;background:var(--green);color:var(--lime);display:grid;place-items:center;font-size:20px;font-weight:700}
    .brand-name{font:600 20px 'Open Sans',Arial,sans-serif;letter-spacing:0}
    .brand small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
    .nav-label{padding:0 11px 10px;font-size:10px;letter-spacing:1.3px;font-weight:700;color:#9aa297;text-transform:uppercase}
    .nav{display:grid;gap:5px}
    .nav button{border:0;background:transparent;color:#69736a;padding:12px 12px;border-radius:8px;text-align:left;display:flex;align-items:center;gap:12px;font-weight:600;font-size:13px;transition:background .18s,color .18s}
    .nav button:hover{background:#edf0e9;color:var(--ink)}
    .nav button.active{background:var(--green);color:#fff}
    .nav-symbol{width:19px;text-align:center;font-size:16px}
    
    .main{min-width:0;zoom:var(--content-zoom,1)}
    .topbar{height:76px;padding:0 clamp(22px,5vw,68px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;background:#f8f8f3}
    .top-context{font-size:12px;color:var(--muted)}
    .top-context strong{color:var(--ink);font-weight:600}
    .top-actions{display:flex;align-items:center;gap:10px}
    
    .page{max-width:1240px;margin:0 auto;padding:36px clamp(22px,5vw,68px) 70px}
    .page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:25px;animation:rise .38s both}
    .eyebrow{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#4c7da8;font-weight:700;margin:0 0 8px}
    .page h1{font:500 clamp(30px,3.2vw,42px)/1.08 'Open Sans',Arial,sans-serif;letter-spacing:0;margin:0;color:#172f4d}
    .page-subtitle{font-size:13px;color:var(--muted);margin:9px 0 0}
    
    .button{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:7px;padding:11px 15px;background:var(--green);color:#fff;font-size:12px;font-weight:700;transition:transform .16s,background .16s}
    .button:hover{background:#102f53;transform:translateY(-1px)}
    .button.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}
    .button.secondary:hover{background:#edf5fb}
    .button.danger{color:#a74432;background:#fff0eb}
    .button.small{padding:8px 11px;font-size:11px}
    .button:disabled{opacity:.45;cursor:not-allowed;transform:none}
    
    .panel{background:var(--paper);border:1px solid #e2ebf4;border-radius:9px;box-shadow:0 4px 18px #18395708}
    .panel-heading{padding:20px 22px 16px;border-bottom:1px solid #edf0ea;display:flex;justify-content:space-between;align-items:center;gap:12px}
    .panel-heading h2{font:500 19px 'Open Sans',Arial,sans-serif;margin:0}
    .panel-heading p{color:var(--muted);font-size:11px;margin:5px 0 0}
    
    .card{background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:32px;width:min(440px,100%);animation:rise .25s both}
    .card h2{font:500 26px/1.15 'Open Sans',Arial,sans-serif;margin:0 0 6px;color:var(--ink)}
    .card input{width:100%;padding:10px 12px;margin-bottom:12px;border:1px solid var(--line);border-radius:6px;font-size:13px;color:var(--ink);background:#fff}
    .card input::placeholder{color:var(--muted)}
    
    .code{font-size:2rem;letter-spacing:4px;color:var(--green);text-align:center;margin:16px 0;font-family:'Open Sans',monospace;font-weight:700}
    
    .lobby-list{list-style:none;margin:16px 0;padding:0}
    .lobby-list li{padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
    .lobby-list li:last-child{border-bottom:0}
    
    #game-screen{flex:1;display:flex;flex-direction:column;height:100vh}
    #game-screen.hidden{display:none}
    #main{flex:1;display:flex;position:relative}
    #sv-container{width:50%;height:100%;position:relative}
    #osm-container{width:50%;height:100%}
    
    #coords{padding:8px 20px;background:#f8f8f3;font-size:12px;color:var(--muted);display:flex;justify-content:center;border-top:1px solid var(--line)}
    #distance{color:var(--green);font-weight:700;font-size:13px}
    
    .role-btns{display:flex;gap:10px;margin-bottom:16px}
    .role-btns button{flex:1;padding:12px;font-size:13px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:7px;font-weight:600}
    .role-btns button:hover{background:#f2f5fb}
    .role-btns button.active{background:var(--green);color:#fff;border-color:var(--green)}
    
    .region-btns{display:flex;gap:10px;margin-bottom:16px}
    .region-btns button{flex:1;padding:10px 16px;border:2px solid var(--line);background:#fff;color:var(--ink);border-radius:7px;cursor:pointer;font-size:13px;font-weight:600;transition:all .18s}
    .region-btns button:hover{border-color:var(--green);background:var(--green-soft)}
    .region-btns button.active{background:var(--green);color:#fff;border-color:var(--green)}
    
    #countdown-bar{padding:10px 20px;background:var(--green);color:#fff;text-align:center;font-size:1.1rem;font-weight:700;display:flex;justify-content:center;align-items:center;gap:16px}
    #round-info{font-size:0.95rem;opacity:0.9}
    #timer-display{font-size:1.3rem;font-variant-numeric:tabular-nums}
    
    .score-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(24,57,87,0.85);display:none;align-items:center;justify-content:center;z-index:9999}
    .score-overlay.hidden{display:none}
    .score-overlay:not(.hidden){display:flex}
    .score-card{background:#fff;padding:30px 40px;border-radius:12px;min-width:min(400px,90%);box-shadow:var(--shadow);animation:rise .25s both}
    .score-card h2{color:var(--ink);margin-bottom:20px;font-size:1.4rem;text-align:center}
    
    #score-table{width:100%;border-collapse:collapse;color:var(--ink)}
    #score-table thead tr{color:var(--green);border-bottom:2px solid var(--line)}
    #score-table th,#score-table td{padding:10px 8px;text-align:left;font-size:13px}
    #score-table th{text-align:left;font-weight:700;font-size:11px;letter-spacing:0.5px;text-transform:uppercase;color:var(--muted)}
    #score-table td:last-child{text-align:right}
    #score-table tbody tr:hover{background:var(--canvas)}
    #score-table tbody tr:nth-child(1){background:var(--green-soft);font-weight:700}
    
    .settings{margin:16px 0;padding:12px;background:var(--canvas);border-radius:7px}
    .settings-label{display:flex;gap:12px;justify-content:center;align-items:center;font-size:12px;color:var(--muted)}
    .settings-label label{font-weight:600;color:var(--ink)}
    .settings-input{width:60px;padding:6px 8px;border:1px solid var(--line);border-radius:5px;text-align:center;font-size:12px;color:var(--ink);background:#fff}
    
    .honeypot{position:absolute;left:-9999px;opacity:0;height:0;width:0;overflow:hidden}
    .error{color:#b23b2b;font-size:12px;font-weight:600;margin-top:12px;min-height:1.2em}
    .info{color:var(--muted);font-size:13px;line-height:1.55;margin:16px 0 0;text-align:center}
    
    @keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
    
    @media(max-width:760px){
      .app-shell{grid-template-columns:1fr}
      .sidebar{height:auto;border-right:0;border-bottom:1px solid var(--line);padding:12px 18px;display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:10px}
      .brand{padding:0}
      .brand-mark{width:34px;height:34px}
      .brand-name{font-size:18px}
      .brand small,.nav-label{display:none}
      .nav{display:flex;gap:3px}
      .nav button{font-size:11px;padding:9px 10px;gap:6px}
      .nav-symbol{display:none}
      .topbar{height:58px;padding:0 18px}
      .page{padding:26px 18px 45px}
      #main{flex-direction:column}
      #sv-container,#osm-container{width:100%;height:50%}
      .card{padding:24px 20px}
      .score-card{padding:24px 20px}
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">G</div>
        <div>
          <div class="brand-name">GeoGuess</div>
          <small>Explore the world</small>
        </div>
      </div>
      <div>
        <div class="nav-label">Navigation</div>
        <nav class="nav" aria-label="Main navigation">
          <button class="active" data-view="game"><span class="nav-symbol" aria-hidden="true">◷</span>Play Game</button>
          <button data-view="scores"><span class="nav-symbol" aria-hidden="true">▦</span>Scores</button>
        </nav>
      </div>
    </aside>
    
    <main class="main">
      <header class="topbar">
        <div class="top-context">
          <strong id="top-view">Game</strong> <span id="top-session"></span>
        </div>
        <div class="top-actions">
          <span id="storage-status" class="storage-status" role="status" aria-live="polite">Loading...</span>
        </div>
      </header>
      
      <section class="page" id="page">
        <!-- Login Screen -->
        <div id="login-screen">
          <div class="card">
            <h2>Join GeoGuess</h2>
            <p style="color:var(--muted);font-size:13px;margin-bottom:20px;">Enter a session code to play</p>
            
            <div id="player-form" style="margin-top:16px;">
              <input id="session-code" placeholder="Session code" autocomplete="off">
              <input id="player-name" placeholder="Your name" autocomplete="name">
              <input type="text" class="honeypot" id="player-honeypot" tabindex="-1" autocomplete="off">
              <button class="button" onclick="joinSession()">Join Session</button>
              <div class="error" id="player-error"></div>
            </div>
            
            <div id="admin-form" style="display:none; margin-top:20px;">
              <input id="admin-name" placeholder="Your name" autocomplete="name">
              <input type="text" class="honeypot" id="admin-honeypot" tabindex="-1" autocomplete="off">
              
              <div class="region-btns">
                <button id="btn-world" onclick="selectRegion('world')">🌍 World</button>
                <button id="btn-europe" onclick="selectRegion('europe')" class="active">🏰 Europe</button>
              </div>
              
              <button class="button" onclick="createSession()">Create Game Session</button>
              <div class="error" id="admin-error"></div>
            </div>
          </div>
        </div>

        <!-- Lobby Screen -->
        <div id="lobby-screen" class="hidden">
          <div class="card">
            <h2 id="lobby-title">Lobby</h2>
            <div class="code" id="lobby-code"></div>
            <p style="color:var(--muted);font-size:12px;text-align:center;margin-bottom:16px;">Share this code with players</p>
            <ul class="lobby-list" id="lobby-players"></ul>
            
            <div id="settings" class="settings" style="display:none; margin:16px 0;">
              <div class="settings-label">
                <label>Rounds:</label>
                <input id="input-rounds" type="number" value="5" min="1" max="10" class="settings-input">
                <label>Timer (s):</label>
                <input id="input-timer" type="number" value="60" min="10" max="120" class="settings-input">
              </div>
            </div>
            
            <button id="start-btn" class="button" onclick="startGame()" style="display:none;">Start Game</button>
            <div class="info" id="lobby-info">Waiting for players...</div>
          </div>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="hidden">
          <div id="countdown-bar">
            <span id="round-info">Round 1/5</span>
            <span>|</span>
            <span id="timer-display">1:00</span>
          </div>
          <div id="main">
            <div id="sv-container"></div>
            <div id="osm-container"></div>
          </div>
          <div id="coords">
            <span id="distance"></span>
          </div>
        </div>

        <!-- Scores Screen -->
        <div id="scores-screen" class="hidden">
          <div class="page-head">
            <h1>Final Scores</h1>
          </div>
          <div class="panel" style="padding:20px;">
            <table id="final-score-table">
              <thead><tr><th>#</th><th>Player</th><th style="text-align:right">Points</th></tr></thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div id="score-overlay" class="score-overlay hidden">
    <div class="score-card">
      <h2>Scores</h2>
      <table id="score-table">
        <thead><tr><th>#</th><th>Player</th><th style="text-align:right">Points</th></tr></thead>
        <tbody></tbody>
      </table>
      <p id="score-next-round"></p>
    </div>
  </div>

  <script>
    let myName = '';
    let sessionCode = '';
    let sessionRegion = 'world';
    let isAdmin = false;
    let totalRounds = 5;
    let currentRound = 1;
    let guessSubmitted = false;
    let roundEnded = false;

    let lastSubmitTime = 0;
    const MIN_SUBMIT_INTERVAL = 2000;

    function checkHoneypot(fieldId) {
      const val = document.getElementById(fieldId).value;
      if (val && val.trim() !== '') {
        return true;
      }
      return false;
    }

    function checkTiming() {
      const now = Date.now();
      if (now - lastSubmitTime < MIN_SUBMIT_INTERVAL) {
        return false;
      }
      lastSubmitTime = now;
      return true;
    }

    let selectedRegion = 'europe';
    function selectRegion(r) {
      selectedRegion = r;
      const bw = document.getElementById('btn-world');
      const be = document.getElementById('btn-europe');
      if (r === 'world') {
        bw.classList.add('active');
        be.classList.remove('active');
      } else {
        be.classList.add('active');
        bw.classList.remove('active');
      }
    }

    selectRegion('europe');

    if (window.location.search.includes('admin')) {
      document.getElementById('player-form').style.display = 'none';
      document.getElementById('admin-form').style.display = 'block';
    }

    async function createSession() {
      if (checkHoneypot('admin-honeypot')) return;
      if (!checkTiming()) return;
      const username = document.getElementById('admin-name').value.trim();
      if (!username) return;
      myName = username;
      isAdmin = true;
      try {
        await fetch('/api/admin/create', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({username, honeypot: document.getElementById('admin-honeypot').value}) });
        const res = await fetch('/api/admin/session', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({username, region: selectedRegion, honeypot: document.getElementById('admin-honeypot').value}) });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        sessionCode = data.code;
        sessionRegion = data.region || 'world';
        enterLobby();
      } catch (e) {
        document.getElementById('admin-error').textContent = e.message;
      }
    }

    async function joinSession() {
      if (checkHoneypot('player-honeypot')) return;
      if (!checkTiming()) return;
      const code = document.getElementById('session-code').value.trim().toUpperCase();
      const username = document.getElementById('player-name').value.trim();
      if (!code || !username) return;
      myName = username;
      isAdmin = false;
      try {
        const res = await fetch('/api/join', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({code, username, honeypot: document.getElementById('player-honeypot').value}) });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        sessionCode = code;
        sessionRegion = data.region || 'world';
        if (data.active) {
          startGameView({ lat: data.lat, lng: data.lng, label: data.label }, data.rounds, data.timer, data.round);
        } else {
          enterLobby();
        }
      } catch (e) {
        document.getElementById('player-error').textContent = e.message;
      }
    }

    function enterLobby() {
      document.getElementById('login-screen').classList.add('hidden');
      document.getElementById('lobby-screen').classList.remove('hidden');
      document.getElementById('lobby-code').textContent = sessionCode;
      document.getElementById('top-session').textContent = `/ ${sessionCode}`;
      if (isAdmin) {
        document.getElementById('lobby-title').textContent = 'Your Game Lobby';
        document.getElementById('start-btn').style.display = 'block';
        document.getElementById('settings').style.display = 'block';
        document.getElementById('lobby-info').textContent = 'Waiting for players to join...';
      } else {
        document.getElementById('lobby-title').textContent = 'Waiting Room';
        document.getElementById('lobby-info').textContent = 'Waiting for admin to start the game...';
      }
      pollLobby();
    }

    async function pollLobby() {
      if (pollInterval) clearInterval(pollInterval);
      pollInterval = setInterval(async () => {
        try {
          const res = await fetch(`/api/session/${sessionCode}`);
          const data = await res.json();
          const list = document.getElementById('lobby-players');
          list.innerHTML = data.players.map(p => `<li>${p === myName ? p + ' (you)' : p}</li>`).join('');
          if (data.status === 'active' && data.location) {
            clearInterval(pollInterval);
            sessionRegion = data.region || 'world';
            startGameView(data.location, data.rounds, data.timer, data.current_round);
          }
        } catch (e) {}
      }, 2000);
    }

    async function startGame() {
      try {
        const rounds = parseInt(document.getElementById('input-rounds').value) || 5;
        const timer = parseInt(document.getElementById('input-timer').value) || 60;
        const res = await fetch(`/api/session/${sessionCode}/start`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({username: myName, rounds, timer}) });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        document.getElementById('lobby-screen').classList.add('hidden');
        startGameView(data.location, rounds, timer, 1);
      } catch (e) {
        document.getElementById('lobby-info').textContent = 'Error: ' + e.message;
      }
    }

    let pollInterval = null;
    let sv, map, currentPos = null, currentLabel = '', svMarker = null, clickMarker = null, polyline = null, distanceLabel = null;

    function updateRoundInfo() {
      document.getElementById('round-info').textContent = `Round ${currentRound}/${totalRounds}`;
    }

    function startGameView(loc, rounds, timer, round) {
      document.getElementById('login-screen').classList.add('hidden');
      document.getElementById('lobby-screen').classList.add('hidden');
      document.getElementById('game-screen').classList.remove('hidden');
      totalRounds = rounds || 5;
      currentRound = round || 1;
      updateRoundInfo();
      currentPos = { lat: loc.lat, lng: loc.lng };
      currentLabel = loc.label || '';
      initMaps(loc);
      startCountdown(timer || 60);
    }

    function initMaps(loc) {
      if (sessionRegion === 'europe') {
        map = L.map('osm-container').setView([50, 15], 4);
      } else {
        map = L.map('osm-container').setView([20, 0], 2);
      }
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);

      map.on('click', function(e) {
        if (guessSubmitted || roundEnded) return;
        clearMarkers();
        clickMarker = L.marker([e.latlng.lat, e.latlng.lng], {icon: L.icon({iconUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png'})}).addTo(map);
        polyline = L.polyline([currentPos, {lat: e.latlng.lat, lng: e.latlng.lng}], {color: '#ffab40', weight: 3, opacity: 0.8, dashArray: '10, 10'}).addTo(map);
        const dist = map.distance(currentPos, {lat: e.latlng.lat, lng: e.latlng.lng});
        document.getElementById('distance').textContent = `Guess: ${(dist/1000).toFixed(1)} km away`;
      });

      if (sv) {
        sv.getPanoramaByLocation({ lat: loc.lat, lng: loc.lng }, 50, (d, status) => {
          if (status === 'OK' && d.location && d.photoId) {
            const p = d.location.latLng;
            updateCoordsDisplay(p.lat(), p.lng());
            sv.setPano(d.photoId);
            sv.setPov({ heading: 0, pitch: 0 });
          } else {
            updateCoordsDisplay(loc.lat, loc.lng);
            sv.setPosition({ lat: loc.lat, lng: loc.lng });
            sv.setPov({ heading: 0, pitch: 0 });
          }
        });
      }
      clearMarkers();
      startCountdown(timer || 60);
    }

    function updateCoordsDisplay(lat, lng) {
      document.getElementById('coords').innerHTML = `<span>Location: ${lat.toFixed(4)}, ${lng.toFixed(4)}</span>`;
    }

    function clearMarkers() {
      if (svMarker) { map.removeLayer(svMarker); svMarker = null; }
      if (clickMarker) { map.removeLayer(clickMarker); clickMarker = null; }
      if (polyline) { map.removeLayer(polyline); polyline = null; }
    }

    function startCountdown(seconds) {
      guessSubmitted = false;
      roundEnded = false;
      let remaining = seconds;
      const timerDisplay = document.getElementById('timer-display');
      
      if (countdownInterval) clearInterval(countdownInterval);
      
      countdownInterval = setInterval(() => {
        remaining--;
        const min = Math.floor(remaining / 60);
        const sec = remaining % 60;
        timerDisplay.textContent = `${min}:${sec.toString().padStart(2, '0')}`;
        
        if (remaining <= 0) {
          clearInterval(countdownInterval);
          submitGuess(null);
        }
      }, 1000);
    }

    async function submitGuess(latlng) {
      if (guessSubmitted || roundEnded) return;
      guessSubmitted = true;
      
      const guess = latlng || { lat: currentPos.lat, lng: currentPos.lng };
      
      try {
        const res = await fetch(`/api/session/${sessionCode}/guess`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({username: myName, lat: guess.lat, lng: guess.lng}) });
        const data = await res.json();
        
        if (res.ok) {
          const dist = map.distance(currentPos, guess);
          document.getElementById('distance').textContent = `Your guess: ${(dist/1000).toFixed(1)} km from ${currentLabel}`;
          
          if (clickMarker) map.removeLayer(clickMarker);
          clickMarker = L.marker([guess.lat, guess.lng], {icon: L.icon({iconUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png'})}).addTo(map);
          
          if (!polyline) {
            polyline = L.polyline([currentPos, guess], {color: '#4fc3f7', weight: 3, opacity: 0.8}).addTo(map);
          }
        }
      } catch (e) {}
    }

    async function showScores() {
      const res = await fetch(`/api/session/${sessionCode}/scores`);
      const data = await res.json();
      const tbody = document.querySelector('#score-table tbody');
      tbody.innerHTML = data.scores.map((s, i) =>
        `<tr><td>${i + 1}</td><td>${s.username}</td><td style="text-align:right">${s.total}</td></tr>`
      ).join('');
      document.getElementById('score-next-round').textContent = 'Next round in 5s...';
      const overlay = document.getElementById('score-overlay');
      overlay.classList.remove('hidden');
      
      await new Promise(r => setTimeout(r, 5000));
      overlay.classList.add('hidden');
    }

    async function showFinalScores() {
      const res = await fetch(`/api/session/${sessionCode}/scores`);
      const data = await res.json();
      const tbody = document.querySelector('#score-table tbody');
      tbody.innerHTML = data.scores.map((s, i) => {
        const highlight = i < 3 ? 'background:var(--green-soft);font-weight:bold;' : '';
        const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : '';
        return `<tr style="${highlight}"><td>${medal || i + 1}</td><td>${s.username}</td><td style="text-align:right">${s.total}</td></tr>`;
      }).join('');
      document.getElementById('score-next-round').textContent = 'Game Over!';
      const overlay = document.getElementById('score-overlay');
      overlay.classList.remove('hidden');
      
      if (isAdmin) {
        let btn = document.getElementById('new-game-btn');
        if (!btn) {
          btn = document.createElement('button');
          btn.id = 'new-game-btn';
          btn.textContent = 'Create New Game';
          btn.className = 'button';
          btn.style.cssText = 'margin-top:16px;width:100%';
          btn.onclick = () => window.location.href = '/?admin';
          overlay.querySelector('.score-card').appendChild(btn);
        }
      }
    }
  </script>
</body>
</html>
