<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeoGuess</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: sans-serif; background: #1a1a2e; color: #fff; height: 100vh; display: flex; flex-direction: column; }
    header { padding: 12px 20px; background: #16213e; display: flex; align-items: center; justify-content: space-between; }
    header h1 { font-size: 1.3rem; }
    header button { background: #0f3460; color: #fff; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-size: 0.9rem; }
    header button:hover { background: #1a5085; }
    #sv-container { flex: 1; }
    #coords { padding: 8px 20px; background: #16213e; font-size: 0.85rem; color: #aaa; }
  </style>
</head>
<body>
  <header>
    <h1>GeoGuess</h1>
    <button id="new-game">New Game</button>
  </header>
  <div id="sv-container"></div>
  <div id="coords">Loading...</div>

  <script>
    const coordsEl = document.getElementById('coords');
    let sv;

    async function init() {
      const res = await fetch('/api/config');
      const { apiKey } = await res.json();
      const script = document.createElement('script');
      script.src = `https://maps.googleapis.com/maps/api/js?key=${apiKey}&callback=initStreetView`;
      script.async = true;
      script.defer = true;
      document.head.appendChild(script);
    }

    function initStreetView() {
      const map = new google.maps.Map(document.getElementById('sv-container'), {
        visible: false
      });
      sv = new google.maps.StreetViewPanorama(
        document.getElementById('sv-container'),
        { visible: false }
      );
      map.setStreetView(sv);
      loadCoords();
    }

    function showCoords(lat, lng) {
      sv.setPosition({ lat, lng });
      sv.setVisible(true);
      coordsEl.textContent = `Coordinates: ${lat}, ${lng}`;
    }

    async function loadCoords() {
      try {
        const res = await fetch('/api/coords');
        const data = await res.json();
        showCoords(data.lat, data.lng);
      } catch (e) {
        coordsEl.textContent = 'Error loading coordinates';
      }
    }

    document.getElementById('new-game').addEventListener('click', async () => {
      try {
        const res = await fetch('/api/new-game');
        const data = await res.json();
        showCoords(data.lat, data.lng);
      } catch (e) {
        coordsEl.textContent = 'Error creating new game';
      }
    });

    init();
  </script>
</body>
</html>
