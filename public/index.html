<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeoGuess</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: sans-serif; background: #1a1a2e; color: #fff; height: 100vh; display: flex; flex-direction: column; }
    header { padding: 12px 20px; background: #16213e; display: flex; align-items: center; justify-content: space-between; }
    header h1 { font-size: 1.3rem; }
    header button { background: #0f3460; color: #fff; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-size: 0.9rem; }
    header button:hover { background: #1a5085; }
    #main { flex: 1; display: flex; }
    #sv-container { width: 50%; height: 100%; position: relative; }
    #sv-debug { position: absolute; top: 10px; left: 10px; z-index: 9999; background: rgba(0,0,0,0.8); color: #ff5252; padding: 8px 12px; border-radius: 4px; font-size: 0.8rem; max-width: 90%; }
    #sv-debug.ok { color: #69f0ae; }
    #osm-container { width: 50%; height: 100%; }
    #coords { padding: 8px 20px; background: #16213e; font-size: 0.85rem; color: #aaa; display: flex; justify-content: space-between; }
    #distance { color: #4fc3f7; font-weight: bold; }
  </style>
</head>
<body>
  <header>
    <h1>GeoGuess</h1>
    <button id="new-game">New Game</button>
  </header>
  <div id="main">
    <div id="sv-container">
      <div id="sv-debug">Loading Google Maps API...</div>
    </div>
    <div id="osm-container"></div>
  </div>
  <div id="coords">
    <span id="coords-text">Loading...</span>
    <span id="distance"></span>
  </div>

  <script>
    const coordsText = document.getElementById('coords-text');
    const distanceEl = document.getElementById('distance');
    const debugEl = document.getElementById('sv-debug');
    let sv;
    let currentPos = null;
    let svMarker = null;
    let clickMarker = null;
    let polyline = null;
    let distanceLabel = null;

    const map = L.map('osm-container').setView([20, 0], 2);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    function clearMarkers() {
      if (clickMarker) map.removeLayer(clickMarker);
      if (polyline) map.removeLayer(polyline);
      if (distanceLabel) map.removeLayer(distanceLabel);
      clickMarker = null;
      polyline = null;
      distanceLabel = null;
    }

    map.on('click', function(e) {
      clearMarkers();
      if (svMarker) { map.removeLayer(svMarker); svMarker = null; }
      const clicked = { lat: e.latlng.lat, lng: e.latlng.lng };
      clickMarker = L.marker(e.latlng, { title: 'Your guess' }).addTo(map);
      if (currentPos) {
        svMarker = L.marker([currentPos.lat, currentPos.lng], { title: 'Street View' }).addTo(map);
        svMarker.bindTooltip('Street View', { permanent: true, direction: 'top', offset: [0, -10] });
        const d = haversine(currentPos.lat, currentPos.lng, clicked.lat, clicked.lng);
        distanceEl.textContent = `Distance: ${formatDistance(d)}`;
        polyline = L.polyline([[currentPos.lat, currentPos.lng], [clicked.lat, clicked.lng]], { color: '#ff5252', weight: 3, dashArray: '8 8' }).addTo(map);
        distanceLabel = L.marker(e.latlng, {
          icon: L.divIcon({
            className: '',
            html: `<div style="background:#1a1a2e;color:#4fc3f7;padding:4px 8px;border-radius:4px;font-size:12px;white-space:nowrap;border:1px solid #4fc3f7;">${formatDistance(d)}</div>`,
            iconSize: [0, 0]
          })
        }).addTo(map);
      }
    });

    function haversine(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function formatDistance(km) {
      if (km < 1) return Math.round(km * 1000) + ' m';
      if (km < 100) return km.toFixed(1) + ' km';
      return Math.round(km) + ' km';
    }

    function showCoords(lat, lng) {
      currentPos = { lat, lng };
      sv.setPosition({ lat, lng });
      coordsText.textContent = `Street View: ${lat}, ${lng}`;
      distanceEl.textContent = '';
      clearMarkers();
      if (svMarker) { map.removeLayer(svMarker); svMarker = null; }
    }

    async function loadCoords() {
      try {
        const res = await fetch('/api/coords');
        const data = await res.json();
        showCoords(data.lat, data.lng);
      } catch (e) {
        coordsText.textContent = 'Error: ' + e.message;
      }
    }

    document.getElementById('new-game').addEventListener('click', async () => {
      try {
        const res = await fetch('/api/new-game');
        const data = await res.json();
        showCoords(data.lat, data.lng);
      } catch (e) {
        coordsText.textContent = 'Error: ' + e.message;
      }
    });

    fetch('/api/config')
      .then(r => {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(({ apiKey }) => {
        if (!apiKey) throw new Error('No API key in config');
        debugEl.textContent = 'Loading Maps JS...';
        const s = document.createElement('script');
        s.src = 'https://maps.googleapis.com/maps/api/js?key=' + apiKey + '&v=weekly';
        s.onload = () => {
          try {
            sv = new google.maps.StreetViewPanorama(document.getElementById('sv-container'), {
              position: { lat: 51.5074, lng: -0.1278 },
              pov: { heading: 0, pitch: 0 },
              zoom: 1,
              addressControl: false,
              zoomControl: false,
              fullscreenControl: false,
              streetSideControls: false,
              showRoadLabels: false,
              showBuildingLabels: false,
              enableCloseButton: false
            });
            debugEl.textContent = 'OK - Street View ready';
            debugEl.className = 'ok';
            setTimeout(() => debugEl.remove(), 3000);
            loadCoords();
          } catch (e) {
            debugEl.textContent = 'Init error: ' + e.message;
          }
        };
        s.onerror = () => {
          debugEl.textContent = 'Failed to load Maps JS script. Check API key restrictions.';
        };
        document.head.appendChild(s);
      })
      .catch(e => {
        debugEl.textContent = 'Config error: ' + e.message;
      });
  </script>
</body>
</html>
